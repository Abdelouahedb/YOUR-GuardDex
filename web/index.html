<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardDex - Secure AES Encryption</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <div class="logo-badge">
                    <svg class="shield-logo" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <rect x="9" y="11" width="6" height="5" rx="1"/>
                        <path d="M10 11V9a2 2 0 0 1 4 0v2"/>
                    </svg>
                </div>
                <h1 class="brand-title">Guard<span class="brand-accent">Dex</span></h1>
            </div>
            <p class="subtitle">Client-Side Secure AES Encryption</p>
        </header>

        <main>
            <div class="glass-panel">
                <div class="tabs">
                    <button class="tab-btn active" id="tab-encrypt" type="button">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <span>Encrypt</span>
                    </button>
                    <button class="tab-btn" id="tab-decrypt" type="button">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
                        <span>Decrypt</span>
                    </button>
                </div>

                <div class="input-group">
                    <label for="message-input" id="message-label">Enter Text to Encrypt</label>
                    <textarea id="message-input" placeholder="Enter your secret message here..."></textarea>
                </div>

                <div class="input-group">
                    <label for="key-input">Secret Encryption Key</label>
                    <div class="password-wrapper">
                        <input type="password" id="key-input" placeholder="Enter secret key...">
                        <button id="toggle-visibility" type="button" aria-label="Toggle key visibility" tabindex="-1">
                            <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="action-btn" class="primary-btn" type="button">
                        <span class="btn-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <span class="btn-text">ENCRYPT</span>
                    </button>
                    <button id="clear-btn" class="secondary-btn" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        <span>CLEAR</span>
                    </button>
                </div>

                <div class="result-group">
                    <label>Payload Result</label>
                    <div class="result-wrapper">
                        <textarea id="result-output" readonly placeholder="Encrypted ciphertext will appear here..."></textarea>
                        <button id="copy-btn" class="copy-btn" type="button" title="Copy to clipboard">
                            <svg class="copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>100% Client-Side. AES-256-GCM + PBKDF2. Zero server transmission.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
